# Builds the daily "tool face-off" comparison card server-side (no browser
# upload needed) and commits it to this repo, mirroring the pattern already
# used by build_fortnight3.yml: script is shipped as gzip+base64 to avoid
# YAML heredoc indentation issues, then run, then committed with the
# workflow's own GITHUB_TOKEN.
#
# Dispatch this with cards_json (see build_comparison_card.py's docstring for
# the expected shape) and output_path (e.g. Comparisons/2026-09-08.png).
# Once this completes, dispatch post_comparison.yml in aitoolindex-bot with
# the same output_path to actually publish the post.

name: Build Comparison Card

on:
  workflow_dispatch:
    inputs:
      cards_json:
        description: "Full cards JSON payload: title, subtitle, tools[], verified_date"
        required: true
        type: string
      output_path:
        description: "Path to save the PNG inside this repo, e.g. Comparisons/2026-09-08.png"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow and Poppins fonts
        run: |
          pip install Pillow
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo cp _fonts/Poppins-Bold.ttf _fonts/Poppins-Medium.ttf /usr/share/fonts/truetype/google-fonts/

      - name: Write build script
        run: "echo '' | base64 -d | gunzip > build_comparison_card.py"

      - name: Write card data and build image
        env:
          CARDS_JSON: ${{ inputs.cards_json }}
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          echo "$CARDS_JSON" > card.json
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          python3 build_comparison_card.py card.json "$OUTPUT_PATH"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Add daily comparison card" && git push)
