{"name":"Run Fortnight 2 build","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"run":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"run":"pip install Pillow"},{"run":"sudo mkdir -p /usr/share/fonts/truetype/google-fonts && sudo cp _fonts/Poppins-Bold.ttf _fonts/Poppins-Medium.ttf /usr/share/fonts/truetype/google-fonts/"},{"run":"cat > ex.py <<'PYEOF2'\nimport base64,gzip,io\ns=io.open('.github/workflows/build_fortnight2.yml',encoding='utf-8').read()\nb=s.split(chr(101)+chr(99)+chr(104)+chr(111)+chr(32)+chr(39))[1].split(chr(39))[0]\nopen('build_f2.py','wb').write(gzip.decompress(base64.b64decode(b)))\nPYEOF2\npython3 ex.py && python3 build_f2.py"},{"run":"git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com' && git add -A && git diff --staged --quiet || git commit -m 'Build Fortnight 2 carousels' && git push"}]}}}
