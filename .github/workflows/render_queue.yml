# Renders carousel slides for tool_data/queue.json into Queue/.
# Runs automatically whenever the queue data or the renderer changes (the
# weekly review edits queue.json), so slides never lag behind the data.
# Only entries whose data changed are re-rendered (see Queue/manifest.json).

name: Render queue slides

on:
  push:
    branches: [main]
    paths:
      - "tool_data/queue.json"
      - "scripts/render_queue.py"
  workflow_dispatch:
    inputs:
      force:
        description: "true = re-render every entry"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: render-queue
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow==11.3.0
      - name: Render
        env:
          FONT_DIR: _fonts
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python scripts/render_queue.py --force; else python scripts/render_queue.py; fi
      - name: Commit slides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Queue
          git diff --staged --quiet && { echo "nothing new to commit"; exit 0; }
          git commit -m "Render queue slides"
          git pull --rebase --autostash
          git push
